<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videowall - Central de Câmeras</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#05080c;color:#e7edf4;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
.topbar{
  height:58px;min-height:58px;background:#0d131a;border-bottom:1px solid #202a35;
  display:flex;align-items:center;justify-content:space-between;padding:0 16px
}
.title{font-size:17px;font-weight:700;letter-spacing:.4px}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select{
  background:#151d26;color:#dfe7ef;border:1px solid #303c48;border-radius:5px;
  padding:7px 10px;font-size:12px;cursor:pointer
}
button:hover,select:hover{background:#1b2631}
.info{font-size:11px;color:#8f9dab;margin-right:5px}
.status{font-size:11px;color:#65d58a}
.wall{
  flex:1;min-height:0;padding:7px;display:grid;gap:7px;background:#020508
}
.camera{
  min-width:0;min-height:0;position:relative;background:#000;border:1px solid #27323d;
  overflow:hidden;cursor:pointer
}
.camera img{width:100%;height:100%;display:block;object-fit:cover;background:#000}
.label{
  position:absolute;left:0;top:0;right:0;height:28px;padding:0 9px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,.78),rgba(0,0,0,.05));
  font-size:11px;font-weight:700;text-shadow:0 1px 2px #000
}
.live{color:#69e18d;font-size:10px}
.time{
  position:absolute;right:7px;bottom:6px;background:rgba(0,0,0,.6);
  padding:3px 5px;border-radius:3px;font-size:9px;color:#b8c2cc
}
.offline{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  flex-direction:column;background:#080b0e;color:#8d99a6;font-size:12px;gap:5px
}
.offline b{color:#f06b6b}
.fullscreen .topbar{display:none}
.fullscreen .wall{padding:0;gap:2px}
@media(max-width:700px){
 .topbar{height:auto;min-height:58px;padding:8px;gap:8px}
 .title{font-size:14px}
 .controls{justify-content:flex-end}
 .info{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="title">📺 VIDEOWALL • CENTRAL DE CÂMERAS</div>
  <div class="controls">
    <span class="info" id="counter">3 câmeras</span>
    <span class="status">● AO VIVO</span>
    <select id="layout">
      <option value="1">1 × 1</option>
      <option value="4" selected>2 × 2</option>
      <option value="9">3 × 3</option>
      <option value="16">4 × 4</option>
      <option value="25">5 × 5</option>
    </select>
    <select id="refresh">
      <option value="1">1s</option>
      <option value="3" selected>3s</option>
      <option value="5">5s</option>
      <option value="10">10s</option>
    </select>
    <button id="fullscreen">⛶ Tela cheia</button>
  </div>
</header>

<main class="wall" id="wall"></main>

<script>
const cameras = [
  {id:"1851", name:"CÂMERA 1851", url:"https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam1851/snap_c1.jpg"},
  {id:"1852", name:"CÂMERA 1852", url:"https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam1852/snap_c1.jpg"},
  {id:"1853", name:"CÂMERA 1853", url:"https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam1853/snap_c1.jpg"}
];

const wall=document.getElementById("wall");
const counter=document.getElementById("counter");
const layoutSelect=document.getElementById("layout");
const refreshSelect=document.getElementById("refresh");
let timer=null;

function gridColumns(n){
  return n===1 ? 1 : Math.ceil(Math.sqrt(n));
}

function buildWall(){
  wall.innerHTML="";
  const slots=Number(layoutSelect.value);
  const cols=gridColumns(slots);
  const rows=Math.ceil(slots/cols);

  wall.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
  wall.style.gridTemplateRows=`repeat(${rows},minmax(0,1fr))`;

  cameras.forEach((cam)=>{
    const card=document.createElement("section");
    card.className="camera";
    card.title="Clique para ampliar";

    card.innerHTML=`
      <div class="label">
        <span>${cam.name}</span>
        <span class="live">● LIVE</span>
      </div>
      <img id="cam-${cam.id}" alt="${cam.name}">
      <div class="offline" id="off-${cam.id}">
        <b>● CÂMERA OFFLINE</b>
        <span>Não foi possível atualizar a imagem</span>
      </div>
      <div class="time" id="time-${cam.id}">--:--:--</div>
    `;

    card.addEventListener("dblclick",()=>expandCamera(card));
    wall.appendChild(card);
  });

  counter.textContent=`${cameras.length} câmeras`;
  updateImages();
}

function updateImages(){
  const now=Date.now();

  cameras.forEach(cam=>{
    const img=document.getElementById(`cam-${cam.id}`);
    const off=document.getElementById(`off-${cam.id}`);
    const time=document.getElementById(`time-${cam.id}`);

    img.onload=()=>{
      img.style.display="block";
      off.style.display="none";
      time.textContent=new Date().toLocaleTimeString("pt-BR");
    };

    img.onerror=()=>{
      img.style.display="none";
      off.style.display="flex";
      time.textContent="ERRO";
    };

    img.src=cam.url+"?refresh="+now;
  });
}

function restartTimer(){
  if(timer) clearInterval(timer);
  timer=setInterval(updateImages,Number(refreshSelect.value)*1000);
}

function expandCamera(card){
  if(document.fullscreenElement){
    document.exitFullscreen();
    return;
  }
  if(card.requestFullscreen) card.requestFullscreen();
}

layoutSelect.addEventListener("change",buildWall);
refreshSelect.addEventListener("change",restartTimer);

document.getElementById("fullscreen").addEventListener("click",()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen();
  }else{
    document.exitFullscreen();
  }
});

document.addEventListener("fullscreenchange",()=>{
  document.body.classList.toggle("fullscreen",!!document.fullscreenElement);
});

buildWall();
restartTimer();
</script>
</body>
</html>
