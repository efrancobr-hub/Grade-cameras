<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santos Mapeada</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #9aa3af;
    --accent: #3ddc84;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }
  header {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0;
  }
  .zone-tag {
    display: inline-block;
    background: rgba(61,220,132,0.12);
    color: var(--accent);
    border: 1px solid rgba(61,220,132,0.3);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    margin-left: 8px;
    vertical-align: middle;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(61,220,132,0.6);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(61,220,132,0.5); }
    70% { box-shadow: 0 0 0 8px rgba(61,220,132,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); }
  }
  .frame {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .imgwrap {
    position: relative;
    width: 100%;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
    aspect-ratio: 16 / 9;
  }
  #cam {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .footer {
    margin-top: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--muted);
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  .error {
    display: none;
    color: #ff6b6b;
    font-size: 0.85rem;
    margin-top: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>Câmera 1285 <span class="zone-tag">NS Fátima</span></h1>
  <div class="status">
    <span class="dot"></span>
    <span>Atualização automática (3s)</span>
  </div>
</header>

<div class="frame">
  <div class="imgwrap">
    <img id="cam" src="https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam0379/snap_c1.jpg" alt="Câmera 1285 - NS Fátima">
  </div>
  <div class="footer">
    <span id="lastUpdate">Última atualização: --:--:--</span>
    <button class="btn" id="pauseBtn">Pausar</button>
  </div>
  <div class="error" id="errorMsg">Falha ao carregar a imagem. Tentando novamente...</div>
</div>

<script>
  const CAMERA_URL = "https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam0379/snap_c1.jpg";
  const REFRESH_MS = 3000;

  const img = document.getElementById('cam');
  const lastUpdate = document.getElementById('lastUpdate');
  const errorMsg = document.getElementById('errorMsg');
  const pauseBtn = document.getElementById('pauseBtn');

  let paused = false;

  function formatTime() {
    const d = new Date();
    return d.toLocaleTimeString('pt-BR');
  }

  function refreshImage() {
    if (paused) return;
    const url = CAMERA_URL + '?t=' + Date.now();
    const tempImg = new Image();
    tempImg.onload = () => {
      img.src = url;
      lastUpdate.textContent = 'Última atualização: ' + formatTime();
      errorMsg.style.display = 'none';
    };
    tempImg.onerror = () => {
      errorMsg.style.display = 'block';
    };
    tempImg.src = url;
  }

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? 'Retomar' : 'Pausar';
  });

  refreshImage();
  setInterval(refreshImage, REFRESH_MS);
</script>

</body>
</html>
