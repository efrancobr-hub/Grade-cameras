<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade de Câmeras</title>
<style>
  :root {
    --bg: #0f1115;
    --card-bg: #1a1d24;
    --border: #2a2e37;
    --accent: #3b82f6;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    font-weight: 600;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .group {
    margin-bottom: 32px;
  }
  .group-title {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 12px 0;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--accent);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 320px));
    gap: 16px;
  }
  .cam-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .cam-title {
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cam-title span.time {
    font-weight: 400;
    font-size: 0.65rem;
    color: var(--muted);
  }
  .cam-image-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    max-height: 220px;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cam-image-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    cursor: zoom-in;
  }
  .cam-image-wrap .error-msg {
    color: #ef4444;
    font-size: 0.85rem;
    padding: 10px;
    text-align: center;
    display: none;
  }
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: zoom-out;
    padding: 30px;
  }
  .lightbox.open {
    display: flex;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .lightbox .lightbox-close {
    position: absolute;
    top: 18px;
    right: 24px;
    color: var(--text);
    font-size: 1.8rem;
    cursor: pointer;
    line-height: 1;
  }
</style>
</head>
<body>

<header>
  <h1>Câmeras NAVIOS COSTA</h1>
  <div class="status">
    <div class="dot"></div>
    <span id="statusText">Atualizando a cada 5s</span>
  </div>
</header>

<div id="groupsContainer"></div>

<div class="lightbox" id="lightbox">
  <span class="lightbox-close" id="lightboxClose">&times;</span>
  <img id="lightboxImg" alt="Câmera ampliada">
</div>

<script>
  const groups = [
    {
      name: "Costa Favolosa",
      cameras: [
        { name: "WebCam PROA", url: "https://webcams.costa.it/Infocruise/GetImage.aspx?imgType=webcam&imgName=WebCam_FA_2.jpg" },
        { name: "WebCam POPA", url: "https://webcams.costa.it/Infocruise/GetImage.aspx?imgType=webcam&imgName=WebCam_FA_1.jpg" }
      ]
    },
    {
      name: "Costa Fortuna",
      cameras: [
        { name: "WebCam PROA", url: "https://webcams.costa.it/InfoCruise/GetImage.aspx?imgType=webcam&imgName=WebCam_FO_1.jpg" },
        { name: "WebCam POPA", url: "https://webcams.costa.it/InfoCruise/GetImage.aspx?imgType=webcam&imgName=WebCam_FO_2.jpg" }
      ]
    },
    {
      name: "Costa Toscana",
      cameras: [
        { name: "WebCam PROA", url: "https://webcams.costa.it/InfoCruise/GetImage.aspx?imgType=webcam&imgName=WebCam_TO_1.jpg" },
        { name: "WebCam POPA", url: "https://webcams.costa.it/InfoCruise/GetImage.aspx?imgType=webcam&imgName=WebCam_TO_2.jpg" }
      ]
    },
    {
      name: "Costa Smeralda",
      cameras: [
        { name: "WebCam PROA", url: "https://webcams.costa.it/InfoCruise/GetImage.aspx?imgType=webcam&imgName=WebCam_ME_1.jpg" },
        { name: "WebCam POPA", url: "https://webcams.costa.it/InfoCruise/GetImage.aspx?imgType=webcam&imgName=WebCam_ME_2.jpg" }
      ]
    }
  ];

  const REFRESH_MS = 5000;
  const container = document.getElementById("groupsContainer");

  function buildCards() {
    groups.forEach((group, gi) => {
      const groupDiv = document.createElement("div");
      groupDiv.className = "group";

      const title = document.createElement("h2");
      title.className = "group-title";
      title.textContent = group.name;
      groupDiv.appendChild(title);

      const grid = document.createElement("div");
      grid.className = "grid";

      group.cameras.forEach((cam, ci) => {
        const id = `${gi}-${ci}`;
        const card = document.createElement("div");
        card.className = "cam-card";
        card.innerHTML = `
          <div class="cam-title">
            <span>${cam.name}</span>
            <span class="time" id="time-${id}">--:--:--</span>
          </div>
          <div class="cam-image-wrap">
            <img id="img-${id}" alt="${cam.name}" onclick="openLightbox('img-${id}')">
            <div class="error-msg" id="err-${id}">Falha ao carregar imagem</div>
          </div>
        `;
        grid.appendChild(card);
      });

      groupDiv.appendChild(grid);
      container.appendChild(groupDiv);
    });
  }

  function refreshImages() {
    const now = new Date().toLocaleTimeString("pt-BR");
    groups.forEach((group, gi) => {
      group.cameras.forEach((cam, ci) => {
        const id = `${gi}-${ci}`;
        const img = document.getElementById(`img-${id}`);
        const err = document.getElementById(`err-${id}`);
        const timeEl = document.getElementById(`time-${id}`);
        const cacheBustUrl = cam.url + (cam.url.includes("?") ? "&" : "?") + "_t=" + Date.now();

        const testImg = new Image();
        testImg.onload = () => {
          img.src = testImg.src;
          img.style.display = "block";
          err.style.display = "none";
          timeEl.textContent = now;
        };
        testImg.onerror = () => {
          err.style.display = "block";
          img.style.display = "none";
          timeEl.textContent = now + " (erro)";
        };
        testImg.src = cacheBustUrl;
      });
    });
  }

  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");

  function openLightbox(imgId) {
    const src = document.getElementById(imgId).src;
    if (!src) return;
    lightboxImg.src = src;
    lightbox.classList.add("open");
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
  }

  lightbox.addEventListener("click", closeLightbox);
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeLightbox();
  });

  buildCards();
  refreshImages();
  setInterval(refreshImages, REFRESH_MS);
</script>

</body>
</html>
