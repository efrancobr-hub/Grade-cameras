<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Videowall 0379 / 0380</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05080c;color:#eee;font-family:Arial,sans-serif;overflow:hidden}
header{height:58px;background:#0d131a;border-bottom:1px solid #26313b;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
h1{font-size:16px;margin:0}.tools{display:flex;gap:7px;align-items:center}button,select{background:#151d26;color:#eee;border:1px solid #34414d;border-radius:5px;padding:7px 10px}
.wall{height:calc(100% - 58px);padding:7px;display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#020508}
.cam{position:relative;min-width:0;min-height:0;background:#000;border:1px solid #27323d;overflow:hidden}
.cam img{width:100%;height:100%;object-fit:contain;display:block}.label{position:absolute;top:0;left:0;right:0;padding:10px;font-size:13px;font-weight:bold;background:linear-gradient(#000c,#0000);z-index:2}.live{float:right;color:#69e18d;font-size:10px}.time{position:absolute;right:8px;bottom:8px;background:#000a;padding:4px;font-size:10px}
.off{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;color:#8995a1;background:#080b0e}.off b{color:#f06b6b}
.nav{display:none}
@media(max-width:700px){
 header{height:54px;padding:0 9px}h1{font-size:13px;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wall{height:calc(100% - 54px);display:block;padding:0}.cam{display:none;border:0;height:100%;width:100%}.cam.active{display:block}
 .cam img{object-fit:contain}.label{font-size:14px;padding:12px}.time{bottom:55px}
 .nav{display:flex;position:absolute;bottom:0;left:0;right:0;height:50px;z-index:5;align-items:center;justify-content:center;gap:18px;background:#070b0fea;border-top:1px solid #26313b}
 .nav button{font-size:20px;min-width:52px;height:34px}.count{font-size:11px;color:#adb7c1}
 #full{font-size:0}#full:after{content:"⛶";font-size:16px}
}
</style></head>
<body>
<header><h1>📺 VIDEOWALL • CÂMERAS 0379 / 0380</h1><div class="tools"><select id="refresh"><option value="1">1s</option><option value="3" selected>3s</option><option value="5">5s</option><option value="10">10s</option></select><button id="full">⛶ Tela cheia</button></div></header>
<main class="wall" id="wall"></main>
<nav class="nav"><button id="prev">‹</button><span class="count" id="count">1 / 2</span><button id="next">›</button></nav>
<script>
const cams=[
{id:"0380",name:"CÂMERA 0380",url:"https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam0380/snap_c1.jpg"},
{id:"0379",name:"CÂMERA 0379",url:"https://egov.santos.sp.gov.br/santosmapeada/css/img/cameras/cam0379/snap_c1.jpg"}];
let current=0,timer;
function build(){wall.innerHTML=cams.map((c,i)=>`<section class="cam ${i?'':'active'}"><div class="label">${c.name}<span class="live">● LIVE</span></div><img id="i${c.id}"><div class="off" id="o${c.id}"><b>● CÂMERA OFFLINE</b><span>Não foi possível atualizar.</span></div><div class="time" id="t${c.id}">--:--:--</div></section>`).join('');update();mobile()}
function update(){const x=Date.now();cams.forEach(c=>{let i=document.getElementById('i'+c.id),o=document.getElementById('o'+c.id),t=document.getElementById('t'+c.id);i.onload=()=>{i.style.display='block';o.style.display='none';t.textContent=new Date().toLocaleTimeString('pt-BR')};i.onerror=()=>{i.style.display='none';o.style.display='flex';t.textContent='ERRO'};i.src=c.url+'?t='+x})}
function mobile(){document.querySelectorAll('.cam').forEach((e,i)=>e.classList.toggle('active',i===current));count.textContent=`${current+1} / ${cams.length}`}
function go(n){current=(current+n+cams.length)%cams.length;mobile()}
prev.onclick=()=>go(-1);next.onclick=()=>go(1);refresh.onchange=()=>{clearInterval(timer);timer=setInterval(update,+refresh.value*1000)}
full.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
let sx=0;wall.ontouchstart=e=>sx=e.changedTouches[0].screenX;wall.ontouchend=e=>{let d=e.changedTouches[0].screenX-sx;if(Math.abs(d)>50)go(d<0?1:-1)};
build();timer=setInterval(update,3000);
</script></body></html>
